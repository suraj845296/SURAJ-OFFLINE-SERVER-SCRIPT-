<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj Oberoy | Premium Cookie Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #06040d; font-family: 'Segoe UI', Arial, sans-serif; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .wrapper { width: 100%; max-width: 500px; }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 { font-size: 26px; color: #ff0055; letter-spacing: 3px; font-weight: 800; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
        .brand-header p { font-size: 11px; color: #00ffcc; text-transform: uppercase; margin-top: 4px; }
        .card { background: linear-gradient(145deg, #140d26, #07040f); border-radius: 20px; padding: 22px; margin-bottom: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255, 255, 255, 0.03); }
        h2 { font-size: 13px; text-transform: uppercase; color: #ff0055; margin-bottom: 15px; letter-spacing: 1px; }
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; color: #8e80ba; margin-bottom: 5px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 10px; color: white; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #ff0055; background: rgba(255, 255, 255, 0.06); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; }
        .btn-pink { background: linear-gradient(90deg, #ff0055, #9c003c); box-shadow: 0 4px 15px rgba(255,0,85,0.3); }
        .btn-red { background: linear-gradient(90deg, #3a0505, #120101); border: 1px solid #ff3333; }
        .console-box { background-color: #000000; border: 1px solid #1a1130; border-radius: 12px; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #00ffcc; margin-top: 20px; display: none; box-shadow: inset 0 0 10px #000; }
        .console-header { display: flex; justify-content: space-between; border-bottom: 1px solid #111; padding-bottom: 6px; margin-bottom: 10px; color: #666; }
        .log-stream { height: 200px; overflow-y: auto; text-align: left; white-space: pre-wrap; color: #00ffaa; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand-header">
        <h1>SURAJ OBEROY</h1>
        <p>🛡️ OPTIMIZED COOKIE INBOX EXPLOITER 🛡️</p>
    </div>

    <div class="card">
        <h2>🔥 Launch Server Session</h2>
        <form id="launchForm">
            <div class="input-group">
                <label>Facebook Account Cookies (JSON or String)</label>
                <textarea id="tokenInput" name="token" rows="4" placeholder="अपने फेसबुक अकाउंट की कुकीज़ यहाँ पेस्ट करें (c_user=xxxx; xs=xxxx...)" required></textarea>
            </div>
            <div class="input-group">
                <label>Group Chat Target UID</label>
                <input type="text" name="convo_id" placeholder="ग्रुप चैट की UID (जैसे: 947906257854222)" required>
            </div>
            <div class="input-group">
                <label>Hater Name (Prefix)</label>
                <input type="text" name="hater_name" placeholder="मैसेज के आगे लगाने वाला नाम...">
            </div>
            <div class="input-group">
                <label>Speed Interval (Seconds)</label>
                <input type="number" step="0.1" name="interval" value="2.0" required>
            </div>
            <div class="input-group">
                <label>Select Message File (.txt)</label>
                <input type="file" name="message_file" accept=".txt" required>
            </div>
            <button type="submit" class="btn btn-pink">⚡ Run Non-Stop Engine</button>
        </form>
    </div>

    <div class="card" style="background: #12030b;">
        <h2>🛑 Kill Task Instance</h2>
        <form id="stopForm">
            <div class="input-group">
                <label>Active Task ID</label>
                <input type="text" name="task_id" id="stopTaskId" placeholder="SO-XXXXXX" required>
            </div>
            <button type="submit" class="btn btn-red">🛑 Terminate Server Thread</button>
        </form>
    </div>

    <div class="console-box" id="consoleBox">
        <div class="console-header">
            <span id="conTaskID">TASK: None</span>
            <span id="conTarget">Sent: 0</span>
            <span id="conStatus" style="color: #ff0055;">Status: Idle</span>
        </div>
        <div class="log-stream" id="logStream">Initializing Suraj Engine Logs Cluster...</div>
    </div>
</div>

<script>
    let logInterval = null;

    function startLogPolling(taskId) {
        if(logInterval) clearInterval(logInterval);
        document.getElementById('consoleBox').style.display = 'block';
        document.getElementById('conTaskID').innerText = `TASK: ${taskId}`;

        logInterval = setInterval(async () => {
            const res = await fetch(`/get-logs/${taskId}`);
            const data = await res.json();
            
            document.getElementById('conTarget').innerText = `Sent Total: ${data.sent_count}`;
            document.getElementById('conStatus').innerText = `Status: ${data.status}`;
            
            const stream = document.getElementById('logStream');
            stream.innerText = data.logs.join('\n');
            stream.scrollTop = stream.scrollHeight;

            if(data.status !== 'Running' && data.status !== 'Starting') {
                clearInterval(logInterval);
            }
        }, 1500);
    }

    document.getElementById('launchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        document.getElementById('logStream').innerText = "Connecting browser gateway profile... Injecting cookies...";
        document.getElementById('consoleBox').style.display = 'block';

        const res = await fetch('/launch-task', { method: 'POST', body: formData });
        const data = await res.json();
        
        if(data.status === 'success') {
            document.getElementById('stopTaskId').value = data.task_id;
            startLogPolling(data.task_id);
        } else {
            alert("Error: " + data.message);
        }
    });

    document.getElementById('stopForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await fetch('/terminate-task', { method: 'POST', body: formData });
        const data = await res.json();
        alert("सिस्टम रिस्पॉन्स: " + data.message);
    });
</script>

</body>
</html>
